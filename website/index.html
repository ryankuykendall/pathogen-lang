<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedestal Design</title>

    <!-- Google Fonts: Baumans (logo) + Inconsolata (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baumans&family=Inconsolata:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-primary: #ffffff;
        --text-primary: #1a1a1a;
        --accent-color: #0066cc;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 3600px;
      }

      body {
        font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 300;
        color: var(--text-primary);
        min-height: 3600px;
      }

      /* Scrolling SVG background — fills the 3600px tall page */
      .bg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3600px;
        z-index: 0;
        pointer-events: none;
      }

      .bg-layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Fixed content with frosted glass */
      .content-layer {
        position: fixed;
        display: inline-block;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        z-index: 1;
        padding: 2rem;
        border-radius: 1rem;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 4px 8px 8px rgba(160, 160, 160, 0.1);
      }

      .container {
        max-width: 600px;
        text-align: left;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 300;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      h2 {
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }

      .pathogen-title {
        font-family: 'Baumans', cursive;
        font-weight: 400;
      }

      p {
        font-size: 1.125rem;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 2rem;
        line-height: 1.6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      .cta {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: rgba(155, 93, 229, 0.1);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 400;
        transition: all 0.15s ease;
        border: 1px solid rgba(155, 93, 229, 0.4);
      }

      .cta:hover {
        background: rgba(155, 93, 229, 0.25);
        border-color: rgba(155, 93, 229, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="bg-layer">
      <img src="/assets/landing-bg.svg" alt="" />
    </div>

    <main class="content-layer">
      <div class="container">
        <h1>Pedestal Design</h1>
        <h2 class="pathogen-title">Pathogen Language</h2>
        <p>A language that extends SVG path syntax with variables, expressions, control flow, and functions.</p>
        <a href="/pathogen/" class="cta pathogen-title">Open Pathogen Studio</a>
      </div>
    </main>
  </body>
</html>
