  <text data-layer-name="lh" id="lh" x="320" y="222" font-family="sans-serif" font-size="11" font-weight="400" fill="oklch(45% 0.02 270)" text-anchor="middle">smaller scale  →  larger noise features        larger scale  →  finer, denser grain</text>
