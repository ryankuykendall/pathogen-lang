  <text data-layer-name="title" id="title" x="30" y="25" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="start">Why @font Matters: Paths vs Text</text>
  <text data-layer-name="anno" id="anno" x="30" y="270" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">fromGlyph() renders text AS paths — the loaded font is</text>
  <text data-layer-name="anno" x="30" y="282" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">both the renderer and the measurer. No mismatch possible.</text>
  <text data-layer-name="anno" x="30" y="300" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">SVG &lt;text&gt; relies on the browser's font — estimation tables</text>
  <text data-layer-name="anno" x="30" y="312" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">or a different @font can diverge from what's rendered.</text>
  <text data-layer-name="insight" id="insight" x="30" y="332" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="start">Paths = single source of truth for geometry AND metrics</text>
