  <text id="l-title" x="30" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e" text-anchor="start">PathBlock.fromGlyph() — exact</text>
  <text id="r-title" x="310" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b" text-anchor="start">SVG &lt;text&gt; — estimated</text>
  <path id="divider" d="M 295 40 v 170" fill="none" stroke="#334155" stroke-width="1"/>
  <text id="title" x="30" y="25" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="start">Why @font Matters: Paths vs Text</text>
  <text id="anno" x="30" y="270" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">fromGlyph() renders text AS paths — the loaded font is</text>
  <text x="30" y="282" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">both the renderer and the measurer. No mismatch possible.</text>
  <text x="30" y="300" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">SVG &lt;text&gt; relies on the browser's font — estimation tables</text>
  <text x="30" y="312" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">or a different @font can diverge from what's rendered.</text>
  <text id="insight" x="30" y="332" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="start">Paths = single source of truth for geometry AND metrics</text>
</svg>