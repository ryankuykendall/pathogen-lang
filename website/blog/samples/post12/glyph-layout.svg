  <text id="labels" x="60" y="156" font-family="monospace" font-size="8" fill="#64748b" text-anchor="start">Bebas Neue · 64px · advanceWidth layout</text>
  <text x="60" y="246" font-family="monospace" font-size="8" fill="#64748b" text-anchor="start">Inconsolata · 48px · uniform advance widths</text>
  <text id="title" x="30" y="30" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="start">Glyph Layout with Advance Widths</text>
  <g id="code-block" transform="translate(350, 20)">
    <text id="code" x="0" y="0" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">let cursor_x = start_x;</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">for (g in glyphs) {</text>
    <text x="8" y="24" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">g.drawTo(cursor_x, baseline)</text>
    <text x="8" y="36" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">cursor_x += g.advanceWidth</text>
    <text x="0" y="48" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">}</text>
    <text id="kw" x="0" y="0" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="start">let</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="start">for</text>
  </g>
