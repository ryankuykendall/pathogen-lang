  <text x="300" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Label Placement: Naive vs polarProject()</text>
  <g transform="translate(330, 270)">
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">for (ai in 0..7) {</text>
    <text x="8" y="10" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">let angle = ai * 0.7854;</text>
    <text x="8" y="20" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">let c = label.polarProject(</text>
    <text x="16" y="30" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">pt.x, pt.y, angle,</text>
    <text x="16" y="40" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">dist, anchors[ai]);</text>
    <text x="8" y="50" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">if (!c.intersects(prev))</text>
    <text x="16" y="60" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">best = c; // found!</text>
    <text x="0" y="70" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="start">}</text>
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="start">for</text>
    <text x="8" y="50" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="start">if</text>
  </g>
