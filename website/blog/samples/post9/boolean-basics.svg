<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" width="580" height="480">

  <path d="M 0 0 L 580 0 L 580 480 L 0 480 Z" fill="#0f172a" stroke="none" stroke-width="2"/>
  <g transform="translate(50, 80)">
    <path d="M 0 0 h 50 v 50 h -50 z M 25 25 h 50 v 50 h -50 z" fill="none" stroke="rgba(148, 163, 184, 0.251)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 0 0 m 0 0 h 50 l 0 25 l 25 0 v 50 h -50 l 0 -25 l -25 0 l 0 -50 z" fill="rgba(59, 130, 246, 0.094)" stroke="#3b82f6" stroke-width="2"/>
    <text x="12" y="15" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
    <text x="62" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>
    <text x="110" y="35" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">.union(B)</text>
    <text x="110" y="50" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">A ∪ B</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="start">Combined outline</text>
  </g>
  <g transform="translate(320, 80)">
    <path d="M 0 0 h 50 v 50 h -50 z M 25 25 h 50 v 50 h -50 z" fill="none" stroke="rgba(148, 163, 184, 0.251)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 0 0 m 0 0 h 50 l 0 25 l -25 0 l 0 25 l -25 0 l 0 -50 z" fill="rgba(59, 130, 246, 0.094)" stroke="#3b82f6" stroke-width="2"/>
    <text x="12" y="15" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
    <text x="62" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>
    <text x="110" y="35" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">.difference(B)</text>
    <text x="110" y="50" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">A \ B</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="start">A minus overlap</text>
  </g>
  <g transform="translate(50, 290)">
    <path d="M 0 0 h 50 v 50 h -50 z M 25 25 h 50 v 50 h -50 z" fill="none" stroke="rgba(148, 163, 184, 0.251)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 0 0 m 50 25 l 0 25 l -25 0 l 0 -25 l 25 0 z" fill="rgba(59, 130, 246, 0.094)" stroke="#3b82f6" stroke-width="2"/>
    <text x="12" y="15" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
    <text x="62" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>
    <text x="110" y="35" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">.intersection(B)</text>
    <text x="110" y="50" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">A ∩ B</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="start">Only overlap</text>
  </g>
  <g transform="translate(320, 290)">
    <path d="M 0 0 h 50 v 50 h -50 z M 25 25 h 50 v 50 h -50 z" fill="none" stroke="rgba(148, 163, 184, 0.251)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 0 0 m 0 0 h 50 l 0 25 l -25 0 l 0 25 l -25 0 l 0 -50 z m 50 25 l 25 0 v 50 h -50 l 0 -25 l 25 0 l 0 -25 z" fill="rgba(59, 130, 246, 0.094)" stroke="#3b82f6" stroke-width="2"/>
    <text x="12" y="15" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
    <text x="62" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>
    <text x="110" y="35" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">.xor(B)</text>
    <text x="110" y="50" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="start">A △ B</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="start">Everything except overlap</text>
  </g>
  <path d="M 290 50 v 390 M 20 255 h 545" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="30" y="440" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="start">let a = sq.project(0, 0);</text>
  <text x="30" y="454" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="start">let result = a.union(sq.project(25, 25));</text>
  <text x="30" y="468" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="start">result.drawTo(0, 0)</text>
  <text x="30" y="440" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="start">let</text>
  <text x="30" y="454" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="start">let</text>
  <text x="30" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="start">Boolean Operations</text>
  <text x="30" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="start">Four set operations on overlapping 50×50 squares</text>
</svg>