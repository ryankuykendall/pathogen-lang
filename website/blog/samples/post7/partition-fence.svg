  <text id="code" x="30" y="272" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="start">let pts = proj.partition(16);</text>
  <text x="30" y="286" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="start">let norm = proj.normal(p.t);</text>
