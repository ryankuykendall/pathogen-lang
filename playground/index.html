<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathogen &mdash; Pedestal Design</title>

    <!-- Google Fonts: Baumans (logo) + Inconsolata (code/subtitle) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baumans&family=Inconsolata:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Custom Properties and Theme -->
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <!-- Root Application Shell with Router -->
    <app-shell></app-shell>

    <!-- svg-path-extended library (must load before app initializes) -->
    <script src="../dist/index.global.js"></script>

    <!-- Resolve bare npm imports to bundled vendor chunks under /vendor -->
    <script type="importmap">
      {
        "imports": {
          "hdr-color-input": "./vendor/hdr-color-input.js"
        }
      }
    </script>

    <!-- Eagerly register the <color-input> custom element before any component upgrades -->
    <script type="module" src="./vendor/hdr-color-input.js"></script>

    <!-- Load the root shell component (imports all other components) -->
    <script type="module">
      import './components/app-shell.js';
    </script>
  </body>
</html>
