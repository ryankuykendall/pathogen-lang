<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathogen Studio &mdash; Pedestal Design</title>

    <!-- Material Symbols sprite — preloaded so first icon render is cache-warm -->
    <link rel="preload" href="/pathogen/assets/material-icons-sprite.svg" as="image" type="image/svg+xml" />

    <!-- Google Fonts: Baumans (logo) + Inconsolata (mono) + DM Sans (body) + DM Serif Display (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baumans&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Inconsolata:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Custom Properties and Theme -->
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <!-- Root Application Shell with Router -->
    <app-shell></app-shell>

    <!-- pathogen-lang library (must load before app initializes) -->
    <script src="../dist/index.global.js"></script>

    <!-- shared pan/zoom controller (window.PathogenPanZoom) -->
    <script src="../dist/pan-zoom.global.js"></script>

    <!-- Resolve bare npm imports to bundled vendor chunks under /vendor -->
    <script type="importmap">
      {
        "imports": {
          "hdr-color-input": "./vendor/hdr-color-input.js"
        }
      }
    </script>

    <!-- Eagerly register the <color-input> custom element before any component upgrades -->
    <script type="module" src="./vendor/hdr-color-input.js"></script>

    <!-- Load the root shell component (imports all other components) -->
    <script type="module">
      import './components/app-shell.js';
    </script>
  </body>
</html>
