const ICON = {

  more: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg>',
};

// gears-project/, as the files are on disk (state 3 shows gears.pathogen mid-edit).
const FILES = {
  'main.pathogen': `// Two gears that mesh.
import { gear, Teeth } from "./parts/gears.pathogen";

define ViewBox(0, 0, 200, 120);

define default PathLayer('gears') #{
  stroke: #2563eb;
  stroke-width: 2;
  fill: none;
}

gear(Point(70, 60), 40, Teeth.Standard);
gear(Point(141, 60), 30, Teeth.Few);`,
  'parts/gears.pathogen': `// A gear: a star outline with a round hub.
module;

export const toothDepth = 6;

export enum Teeth { Few = 8, Standard = 12, Fine = 20 }

export fn gear(center, radius, teeth) {
  star(center.x, center.y, radius, radius - toothDepth, teeth);
  hub(center, radius);
}

// Not exported: only this file can use it.
fn hub(center, radius) {
  circle(center.x, center.y, radius * 0.3);
}`,
  'demos/train.pathogen': `// A gear train: five gears in a row, alternating sizes.
import { gear, Teeth } from "../parts/gears.pathogen";

define ViewBox(0, 0, 320, 100);

define default PathLayer('gears') #{
  stroke: #c2410c;
  stroke-width: 2;
  fill: none;
}

for (i in 0..4) {
  let radius = i % 2 == 0 ? 30 : 22;
  gear(Point(40 + i * 60, 50), radius, i % 2 == 0 ? Teeth.Standard : Teeth.Few);
}`,
  'try-sizes.pathogen': `// Three sizes side by side.
import { gear, Teeth } from "./parts/gears.pathogen";

define ViewBox(0, 0, 300, 100);

define default PathLayer('gears') #{
  stroke: #059669;
  stroke-width: 2;
  fill: none;
}

for (i in 0..2) {
  gear(Point(50 + i * 100, 50), 20 + i * 10, Teeth.Standard);
}`,
  'sketch.pathogen': `// A sketch, not listed in pathogen.json: one fine gear.
import { gear, Teeth } from "./parts/gears.pathogen";

define ViewBox(0, 0, 120, 120);

define default PathLayer('gears') #{
  stroke: #7c3aed;
  stroke-width: 1.5;
  fill: none;
}

gear(Point(60, 60), 50, Teeth.Fine);`,
};
const EDITED_GEARS = FILES['parts/gears.pathogen'].replace('toothDepth = 6', 'toothDepth = 10');
const BROKEN_TRY = FILES['try-sizes.pathogen'].replace('20 + i * 10, Teeth.Standard', '20 + i * 10');

const DRAWING = {
  'main.pathogen': 'renders/main.svg',
  'demos/train.pathogen': 'renders/train.svg',
  'try-sizes.pathogen': 'renders/try-sizes.svg',
  'sketch.pathogen': 'renders/sketch.svg',
};
const LISTED = ['main.pathogen', 'demos/train.pathogen', 'try-sizes.pathogen'];
const nameOf = (path) => path.split('/').pop().replace(/\.pathogen$/, '');
const fileOf = (path) => path.split('/').pop();

// What each state shows. editing: the active tab; shown: the program the preview shows (null: none).
const STATES = [
  {
    id: 'today', label: 'Today: editing a module',
    caption: '<b>Today, for comparison.</b> You switch to <code>parts/gears.pathogen</code>, a module, and the preview follows you: it’s empty, with “This file is a module…”. The panel is titled <i>Pathogen Preview</i> whatever it shows, and there’s no chip.',
    editing: 'parts/gears.pathogen', shown: null, today: true,
    notice: 'This file is a module: a module doesn’t draw, so its preview is empty. To see its fns draw, open a program that imports it.',
  },
  {
    id: 'opened', label: '1 · Opened on the main',
    caption: '<b>The preview button on <code>main.pathogen</code>’s tab</b> opens the preview on it. The chip, beside the zoom controls as in the playground, names the program shown, and so does the panel’s title. The chip shows when the project has more than one program.',
    editing: 'main.pathogen', shown: 'main.pathogen',
  },
  {
    id: 'list', label: '2 · The program list',
    caption: '<b>Click the chip: the program list, as in the playground.</b> The main first, then <code>pathogen.json</code>’s <code>entryPoints</code> in order. Each row has its miniature, name and path; a check marks the program shown. Hovering a row shows <i>Open in the editor</i>, which opens its tab without changing the preview.',
    editing: 'main.pathogen', shown: 'main.pathogen', listOpen: true, hover: 'demos/train.pathogen',
  },
  {
    id: 'module', label: '3 · Editing a module',
    caption: '<b>You switch to <code>parts/gears.pathogen</code> and change <code>toothDepth</code> to 10.</b> The preview stays on <code>main</code> and redraws with your edit, deeper teeth and all. With the list open, a dot marks each program that uses the file you’re editing, as in the playground.',
    editing: 'parts/gears.pathogen', shown: 'main.pathogen', listOpen: true, edited: true,
  },
  {
    id: 'demo', label: '4 · A demo’s preview button',
    caption: '<b>The preview button on <code>demos/train.pathogen</code>’s tab</b> (your answer 2a) shows that program and makes it the choice. From here, switching tabs leaves the preview on <code>train</code> until you choose another program.',
    editing: 'demos/train.pathogen', shown: 'demos/train.pathogen', pressed: true,
  },
  {
    id: 'unlisted', label: '5 · A program not in pathogen.json',
    caption: '<b><code>sketch.pathogen</code> isn’t in <code>pathogen.json</code>.</b> Switching to it leaves the preview on the program shown. The list adds the file you’re editing at the end, marked “not in pathogen.json”, so you can still choose it; its tab’s preview button does the same.',
    editing: 'sketch.pathogen', shown: 'main.pathogen', listOpen: true, extra: 'sketch.pathogen',
  },
  {
    id: 'error', label: '6 · Another program has an error',
    caption: '<b><code>try-sizes.pathogen</code> has an error</b> (a <code>gear</code> call without its teeth). The chip’s red dot says another program has one, and its row says where, in the playground’s words. The program shown draws as usual.',
    editing: 'main.pathogen', shown: 'main.pathogen', listOpen: true, errors: { 'try-sizes.pathogen': 'Error in try-sizes.pathogen line 13' },
  },
  {
    id: 'broken', label: '7 · The main is missing',
    caption: '<b><code>pathogen.json</code> lists <code>poster.pathogen</code> first, and it doesn’t exist.</b> Opened from a module’s tab, the preview shows the main, so it shows the CLI’s own message for a folder compile. The chip still offers the other programs. <i>The row’s “Not found” is new wording.</i>',
    editing: 'parts/gears.pathogen', shown: 'poster.pathogen', listOpen: true, broken: true,
  },
  {
    id: 'lone', label: '8 · No pathogen.json: unchanged',
    caption: '<b>Unchanged: a folder with no <code>pathogen.json</code>, or a single file</b> (your answer 1a). The preview follows the file you’re editing, with no chip, as today. Only the panel’s title is new.',
    editing: 'sketch.pathogen', shown: 'sketch.pathogen', lone: true,
  },
];

const ui = { state: 'opened', theme: 'dark', place: 'zoom', rows: 'mini' };
try {
  const saved = JSON.parse(localStorage.getItem('mockup-2f') || '{}');
  Object.assign(ui, saved);
} catch { /* first visit */ }

function highlight(src) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(import|from|export|module|define|default|for|in|return|if|else)\b|\b(const|let|fn|enum)\b|(#[0-9a-fA-F]{6}\b|\b\d+(?:\.\d+)?\b)|\b([A-Za-z_]\w*)(?=\()/gm;
  let out = '';
  let last = 0;
  for (const m of src.matchAll(re)) {
    out += esc(src.slice(last, m.index));
    const [text, c, s, k, st, num, fn] = m;
    const cls = c ? 't-c' : s ? 't-str' : k ? 't-k' : st ? 't-s' : num ? 't-num' : fn ? 't-fn' : '';
    out += `<span class="${cls}">${esc(text)}</span>`;
    last = m.index + text.length;
  }
  return out + esc(src.slice(last));
}

function codeHtml(src, curLine) {
  return src.split('\n').map((line, i) =>
    `<div class="ln${i + 1 === curLine ? ' cur' : ''}"><span class="n">${i + 1}</span><span>${highlight(line)}${i + 1 === curLine ? '<span class="caret-bar"></span>' : ''}</span></div>`,
  ).join('');
}

function programsFor(st) {
  if (st.broken) return ['poster.pathogen', ...LISTED];
  const list = [...LISTED];
  if (st.extra && !list.includes(st.extra)) list.push(st.extra);
  return list;
}

function rowHtml(st, path) {
  const on = path === st.shown;
  const error = st.broken && path === 'poster.pathogen' ? 'Not found' : (st.errors?.[path] ?? null);
  const uses = st.editing !== st.shown && (path === st.editing ? 'self' : (st.editing === 'parts/gears.pathogen' && path !== 'poster.pathogen') ? 'import' : null);
  const dotTitle = uses === 'self' ? 'The file you’re editing' : `Uses ${st.editing}, the file you’re editing`;
  const badge = st.broken && path === 'poster.pathogen' ? '<span class="badge" title="The main">main</span>' : '';
  const img = DRAWING[path] && !(st.broken && path === 'poster.pathogen')
    ? `<img src="${path === 'main.pathogen' && st.edited ? 'renders/main-edited.svg' : DRAWING[path]}" alt="">` : '';
  const sub = error !== null
    ? `<span class="e">${error}</span>`
    : `<span class="p">${path}${st.extra === path ? ' <span class="note">· not in pathogen.json</span>' : ''}</span>`;
  const classes = ['prow', on ? 'on' : '', error !== null ? 'err' : '', st.hover === path ? 'hov' : ''].filter(Boolean).join(' ');
  return `<div class="${classes}">
    <div class="show"><span class="tile">${img}${error !== null && img ? '<span class="mbad">!</span>' : ''}</span>
      <span class="t"><span class="n">${uses ? `<span class="udot" title="${dotTitle}"></span>` : ''}<span class="nm">${nameOf(path)}</span>${badge}</span>${sub}</span></div>
    <span class="r"><span class="open" title="Open ${path} in the editor">${ICON.code}</span>${on ? `<span class="chk" title="Shown">${ICON.check}</span>` : ''}</span>
  </div>`;
}

function chipHtml(st) {
  const programs = programsFor(st);
  const alert = Object.keys(st.errors ?? {}).some((p) => p !== st.shown);
  const list = st.listOpen
    ? `<div class="list ${ui.rows === 'names' ? 'names' : ''}"><div class="head"><span>Programs</span><span class="cnt">${programs.length}</span></div>
        <div class="rows">${programs.map((p) => rowHtml(st, p)).join('')}</div></div>`
    : '';
  return `<div class="chip">${list}<span class="pick" aria-expanded="${st.listOpen ? 'true' : 'false'}" title="Showing ${st.shown}. Choose a program"><span class="name">${nameOf(st.shown)}</span>${alert ? '<span class="err" title="Another program has an error"></span>' : ''}<span class="caret">${ICON.chevronUp}</span></span></div>`;
}

function render() {
  document.documentElement.dataset.theme = ui.theme;
  const st = STATES.find((s) => s.id === ui.state) ?? STATES[1];
  for (const b of document.querySelectorAll('#states button')) b.setAttribute('aria-pressed', String(b.dataset.st === st.id));
  for (const b of document.querySelectorAll('[data-theme-set]')) b.setAttribute('aria-pressed', String(b.dataset.themeSet === ui.theme));
  for (const b of document.querySelectorAll('[data-place]')) b.setAttribute('aria-pressed', String(b.dataset.place === ui.place));
  for (const b of document.querySelectorAll('[data-rows]')) b.setAttribute('aria-pressed', String(b.dataset.rows === ui.rows));
  const variants = [];
  if (ui.place === 'toolbar') variants.push('Variant: the chip at the start of the preview’s toolbar, its list opening downward.');
  if (ui.rows === 'names') variants.push('Variant: the list without miniatures (names and paths only).');
  document.getElementById('caption').innerHTML = st.caption + (variants.length ? `<span class="variant">${variants.join(' ')}</span>` : '');

  const withChip = !st.today && !st.lone;
  const project = st.lone ? 'sketches' : 'gears-project';
  const tabsLeft = st.lone
    ? ['sketch.pathogen']
    : st.id === 'opened' || st.id === 'list' || st.id === 'error'
      ? ['main.pathogen']
      : st.id === 'today' || st.id === 'module' || st.id === 'broken'
        ? ['main.pathogen', 'parts/gears.pathogen']
        : st.id === 'demo' ? ['main.pathogen', 'demos/train.pathogen'] : ['main.pathogen', 'sketch.pathogen'];
  const source = st.editing === 'parts/gears.pathogen' && st.edited ? EDITED_GEARS
    : st.editing === 'try-sizes.pathogen' && st.errors ? BROKEN_TRY : FILES[st.editing];
  const curLine = st.edited ? 4 : st.editing === 'main.pathogen' ? 12 : 1;
  // VS Code adds a tab's folder only when two open tabs share a name; none do here.
  const tab = (path) => `<div class="tab${path === st.editing ? ' on' : ''}"><span class="ic"></span>${fileOf(path)}<span class="x">×</span></div>`;
  const treeFiles = st.lone
    ? [['f', 'sketch.pathogen', 0], ['f', 'waves.pathogen', 0]]
    : [['d', 'demos', 0], ['f', 'demos/train.pathogen', 1], ['d', 'parts', 0], ['f', 'parts/gears.pathogen', 1],
       ['f', 'main.pathogen', 0], ['j', 'pathogen.json', 0], ['f', 'sketch.pathogen', 0], ['f', 'try-sizes.pathogen', 0]];
  const tree = treeFiles.map(([kind, path, depth]) =>
    `<div class="${kind === 'd' ? 'folder' : ''}${path === st.editing ? ' on' : ''}" style="padding-left:${12 + depth * 14}px">${kind === 'd' ? '' : `<span class="ic${kind === 'j' ? ' json' : ''}"></span>`}${fileOf(path)}</div>`,
  ).join('');

  const title = st.today ? 'Pathogen Preview' : `Preview ${fileOf(st.shown)}`;
  const drawing = st.shown && DRAWING[st.shown] ? (st.shown === 'main.pathogen' && st.edited ? 'renders/main-edited.svg' : DRAWING[st.shown]) : null;
  const errorBlock = st.broken
    ? `<div class="werror"><div class="title">Compilation Error</div>The main of gears-project, poster.pathogen, doesn't exist (looked for /Users/you/gears-project/poster.pathogen). pathogen.json lists it first in "entryPoints": add the file, or put another program first.</div>`
    : '';
  const chip = withChip ? chipHtml(st) : '';
  const zoom = `<span class="zp"><span class="big">−</span><span>Fit</span><span class="big">+</span><span class="pct">100%</span></span>`;
  const status = st.broken ? 'Error' : st.today ? 'Compiled' : 'Compiled';
  const info = st.today || st.broken ? '' : '1 layer · 3 ms';

  document.getElementById('vsc').innerHTML = `
    <div class="titlebar"><span class="lights"><i></i><i></i><i></i></span>${fileOf(st.editing)} — ${project} — Visual Studio Code</div>
    <div class="body">
      <div class="activity"><i></i><i></i><i></i><i></i></div>
      <div class="sidebar"><div class="hd">EXPLORER</div><div class="sec">⌄ ${project.toUpperCase()}</div><div class="tree">${tree}</div></div>
      <div class="groups">
        <div class="group">
          <div class="tabs">${tabsLeft.map(tab).join('')}<span class="spacer"></span>
            <span class="actions"><span class="act${st.pressed ? ' pressed' : ''}" title="Pathogen: Open Preview to the Side">${ICON.preview}</span><span class="act">${ICON.split}</span><span class="act">${ICON.more}</span></span></div>
          <div class="editor"><div class="crumbs">${st.editing.split('/').join(' › ')}</div><div class="code">${codeHtml(source, curLine)}</div></div>
        </div>
        <div class="group">
          <div class="tabs"><div class="tab on"><span class="pv">${ICON.preview}</span>${title}<span class="x">×</span></div><span class="spacer"></span>
            <span class="actions"><span class="act">${ICON.split}</span><span class="act">${ICON.more}</span></span></div>
          <div class="webview">
            <div class="toolbar">${withChip && ui.place === 'toolbar' ? chip : ''}<span class="status">${status}</span><span class="info">${info}</span>
              <button>&#x21bb;</button><button>Reset</button><button>Inspector</button></div>
            ${st.notice ? `<div class="notices">${st.notice}</div>` : ''}
            <div class="wmain"><div class="canvas">
              ${drawing ? `<img class="drawing" src="${drawing}" alt="">` : ''}
              ${drawing ? `<div class="navigator"><img src="${drawing}" alt=""><i></i></div>` : ''}
              ${errorBlock}
              <div class="bottom-group">${zoom}${withChip && ui.place === 'zoom' ? chip : ''}</div>
            </div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="statusbar"><span>⎇ main</span><span>⊗ 0 ⚠ 0</span><span class="sp"></span><span>Ln ${curLine}, Col 1</span><span>Spaces: 2</span><span>UTF-8</span><span>Pathogen</span></div>`;
  try { localStorage.setItem('mockup-2f', JSON.stringify(ui)); } catch { /* a file:// page may refuse */ }
}

const nav = document.getElementById('states');
for (const s of STATES) {
  const b = document.createElement('button');
  b.dataset.st = s.id;
  b.textContent = s.label;
  b.addEventListener('click', () => { ui.state = s.id; render(); });
  nav.appendChild(b);
}
for (const b of document.querySelectorAll('[data-theme-set]')) b.addEventListener('click', () => { ui.theme = b.dataset.themeSet; render(); });
for (const b of document.querySelectorAll('[data-place]')) b.addEventListener('click', () => { ui.place = b.dataset.place; render(); });
for (const b of document.querySelectorAll('[data-rows]')) b.addEventListener('click', () => { ui.rows = b.dataset.rows; render(); });
render();
</script>
</body>
</html>
