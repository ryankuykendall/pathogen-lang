<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

<defs>
  <linearGradient id="pathogen-motion-blur-1-ramp" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="1"/>
  </linearGradient>
  <rect id="pathogen-motion-blur-1-mask" x="0" y="0" width="100%" height="100%" fill="url(#pathogen-motion-blur-1-ramp)"/>
  <filter id="pathogen-motion-blur-1" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blurred"/>
    <feImage href="#pathogen-motion-blur-1-mask" result="ramp"/>
    <feComponentTransfer in="ramp" result="invRamp">
      <feFuncA type="table" tableValues="1 0"/>
    </feComponentTransfer>
    <feComposite in="SourceGraphic" in2="invRamp" operator="in" result="sharpPart"/>
    <feComposite in="blurred" in2="ramp" operator="in" result="blurPart"/>
    <feComposite in="sharpPart" in2="blurPart" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
  </filter>
</defs>

  <path data-layer-name="bg" id="bg" d="M 0 0 l 200 0 l 0 200 l -200 0 z" fill="oklch(22% 0.03 265)" stroke="#000" stroke-width="2"/>
  <path data-layer-name="bars" id="bars" d="M 24 22 l 152 0 l 0 12 l -152 0 z M 24 50 l 152 0 l 0 12 l -152 0 z M 24 78 l 152 0 l 0 12 l -152 0 z M 24 106 l 152 0 l 0 12 l -152 0 z M 24 134 l 152 0 l 0 12 l -152 0 z M 24 162 l 152 0 l 0 12 l -152 0 z" fill="oklch(86% 0.13 200)" stroke="#000" stroke-width="2" filter="url(#pathogen-motion-blur-1)"/>
</svg>