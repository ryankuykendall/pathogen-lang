<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">

<defs>
  <marker id="dot" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <path d="M -5 0 A 5 5 0 1 1 5 0 A 5 5 0 1 1 -5 0" fill="context-stroke"/>
  </marker>
</defs>

  <path data-layer-name="polyline" id="polyline" d="M 70 150 L 170 100 L 270 190 L 380 120" fill="none" stroke="#b23a48" stroke-width="4" marker-start="url(#dot)" marker-mid="url(#dot)" marker-end="url(#dot)"/>
  <path data-layer-name="viewbox-frame" id="viewbox-frame" d="M 570 120 h 120 v 120 h -120 z" fill="#fff7e0" stroke="#333" stroke-width="1.5"/>
  <path data-layer-name="clipped-outline" id="clipped-outline" d="M 570 120 m -60 0 a 60 60 0 1 1 120 0 a 60 60 0 1 1 -120 0" fill="#b23a48" stroke="#b23a48" stroke-width="1.5" stroke-dasharray="5 4" fill-opacity="0.12"/>
  <path data-layer-name="visible-quadrant" id="visible-quadrant" d="M 570 120 h 60 a 60 60 0 0 1 -60 60 z" fill="#b23a48" stroke="none" stroke-width="2"/>
  <path data-layer-name="ref-cross" id="ref-cross" d="M 622 180 h 16 M 630 172 v 16" fill="none" stroke="#333" stroke-width="1.5"/>
  <text data-layer-name="titles" id="titles" x="40" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">What renders</text>
  <text data-layer-name="titles" x="500" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Why — viewBox vs the block's box, at 12×</text>
  <text data-layer-name="labels" id="labels" x="40" y="230" font-family="sans-serif" font-size="13" fill="#444">circle(0, 0, 5) appended to Marker('dot', 10, 10)</text>
  <text data-layer-name="labels" x="40" y="250" font-family="sans-serif" font-size="13" fill="#444">Each vertex shows one quarter of the dot: the quadrant inside the viewBox.</text>
  <text data-layer-name="labels" x="696" y="132" font-family="sans-serif" font-size="13" fill="#444">viewBox 0 0 10 10 (the default)</text>
  <text data-layer-name="labels" x="696" y="150" font-family="sans-serif" font-size="13" fill="#444">only this area is drawn</text>
  <text data-layer-name="labels" x="636" y="196" font-family="sans-serif" font-size="13" fill="#444">refX, refY = 5, 5</text>
  <text data-layer-name="labels" x="510" y="270" font-family="sans-serif" font-size="13" fill="#444">the block's box: -5…5 × -5…5</text>
  <text data-layer-name="labels" x="510" y="288" font-family="sans-serif" font-size="13" fill="#444">three quadrants fall outside the viewBox</text>
  <text data-layer-name="callout" id="callout" x="40" y="320" font-family="monospace" font-size="12" fill="#7a1f2b">Proposed marker-space warning (V7, cheap half):</text>
  <text data-layer-name="callout" x="40" y="340" font-family="monospace" font-size="12" fill="#7a1f2b">  &quot;the appended block spans -5…5 × -5…5 but the marker's viewBox is 0 0 10 10</text>
  <text data-layer-name="callout" x="40" y="358" font-family="monospace" font-size="12" fill="#7a1f2b">   — set viewBox or refX/refY, or translate the block&quot;</text>
  <text data-layer-name="callout" x="40" y="392" font-family="monospace" font-size="12" fill="#7a1f2b">The numbers above come from dot.boundingBox() — the check has all it needs today.</text>
</svg>