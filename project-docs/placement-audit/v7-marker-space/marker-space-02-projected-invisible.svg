<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">

<defs>
  <marker id="ghost" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <path d="M 200 150 L 210 155 L 200 160 Z" fill="context-stroke"/>
  </marker>
  <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/>
  </marker>
</defs>

  <path data-layer-name="ghost-line" id="ghost-line" d="M 60 120 L 380 120" fill="none" stroke="#2f6f8f" stroke-width="4" marker-end="url(#ghost)"/>
  <path data-layer-name="arrow-line" id="arrow-line" d="M 60 200 L 380 200" fill="none" stroke="#2f6f8f" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-layer-name="viewbox-frame" id="viewbox-frame" d="M 500 110 h 10 v 10 h -10 z" fill="#fff7e0" stroke="#333" stroke-width="1.5"/>
  <path data-layer-name="leader" id="leader" d="M 510 120 L 700 260" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <path data-layer-name="placed-arrow" id="placed-arrow" d="M 700 260 m 0 0 l 10 5 l -10 5 z" fill="#2f6f8f" stroke="none" stroke-width="2"/>
  <text data-layer-name="titles" id="titles" x="40" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">What renders</text>
  <text data-layer-name="titles" x="500" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Why — at page scale (1 unit = 1 px)</text>
  <text data-layer-name="labels" id="labels" x="40" y="100" font-family="sans-serif" font-size="13" fill="#444">marker-end: a ProjectedPath, arrow.project(200, 150)</text>
  <text data-layer-name="labels" x="40" y="150" font-family="sans-serif" font-size="13" fill="#444">nothing at the end of the line</text>
  <text data-layer-name="labels" x="40" y="180" font-family="sans-serif" font-size="13" fill="#444">marker-end: the same arrow as a PathBlock</text>
  <text data-layer-name="labels" x="40" y="230" font-family="sans-serif" font-size="13" fill="#444">renders</text>
  <text data-layer-name="labels" x="518" y="118" font-family="sans-serif" font-size="13" fill="#444">viewBox 0 0 10 10 — all the marker can show</text>
  <text data-layer-name="labels" x="518" y="136" font-family="sans-serif" font-size="13" fill="#444">(the marker's own space)</text>
  <text data-layer-name="labels" x="480" y="310" font-family="sans-serif" font-size="13" fill="#444">inside the marker: M 200 150 L 210 155 L 200 160 Z</text>
  <text data-layer-name="labels" x="480" y="328" font-family="sans-serif" font-size="13" fill="#444">page coordinates, 200 units from the viewBox</text>
  <text data-layer-name="callout" id="callout" x="40" y="320" font-family="monospace" font-size="12" fill="#1d4b63">Proposed marker-space warning (V7, cheap half):</text>
  <text data-layer-name="callout" x="40" y="340" font-family="monospace" font-size="12" fill="#1d4b63">  &quot;a ProjectedPath carries page coordinates; a Marker draws in its own viewBox</text>
  <text data-layer-name="callout" x="40" y="358" font-family="monospace" font-size="12" fill="#1d4b63">   (0 0 10 10) — append a PathBlock, or toPathBlock() and re-place it&quot;</text>
  <text data-layer-name="callout" x="40" y="392" font-family="monospace" font-size="12" fill="#1d4b63">It cannot be right, so an error is defensible; a warning keeps existing markers compiling.</text>
</svg>