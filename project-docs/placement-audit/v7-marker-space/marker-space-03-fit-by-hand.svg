<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">

<defs>
  <marker id="dot-fitted" viewBox="-5 -5 10 10" markerWidth="10" markerHeight="10" refX="0" refY="0" orient="auto">
    <path d="M -5 0 A 5 5 0 1 1 5 0 A 5 5 0 1 1 -5 0" fill="context-stroke"/>
  </marker>
  <marker id="arrow-fitted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/>
  </marker>
</defs>

  <path data-layer-name="polyline" id="polyline" d="M 70 120 L 170 80 L 270 160 L 380 100" fill="none" stroke="#2a7f62" stroke-width="4" marker-start="url(#dot-fitted)" marker-mid="url(#dot-fitted)" marker-end="url(#dot-fitted)"/>
  <path data-layer-name="arrow-line" id="arrow-line" d="M 70 250 L 380 250" fill="none" stroke="#2a7f62" stroke-width="4" marker-end="url(#arrow-fitted)"/>
  <path data-layer-name="viewbox-frame" id="viewbox-frame" d="M 560 150 m -60 -60 h 120 v 120 h -120 z" fill="#eaf6f0" stroke="#333" stroke-width="1.5"/>
  <path data-layer-name="whole-dot" id="whole-dot" d="M 560 150 m -60 0 a 60 60 0 1 1 120 0 a 60 60 0 1 1 -120 0" fill="#2a7f62" stroke="none" stroke-width="2"/>
  <path data-layer-name="ref-cross" id="ref-cross" d="M 552 150 h 16 M 560 142 v 16" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text data-layer-name="titles" id="titles" x="40" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">What renders — fitted</text>
  <text data-layer-name="titles" x="500" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Why — viewBox = the block's box, at 12×</text>
  <text data-layer-name="labels" id="labels" x="40" y="195" font-family="sans-serif" font-size="13" fill="#444">whole dots: the viewBox is the block's box, ref at its centre</text>
  <text data-layer-name="labels" x="40" y="285" font-family="sans-serif" font-size="13" fill="#444">the projected arrow, after toPathBlock() and the same fit</text>
  <text data-layer-name="labels" x="628" y="86" font-family="sans-serif" font-size="13" fill="#444">viewBox -5 -5 10 10</text>
  <text data-layer-name="labels" x="628" y="104" font-family="sans-serif" font-size="13" fill="#444">refX, refY = 0, 0</text>
  <text data-layer-name="code" id="code" x="40" y="322" font-family="monospace" font-size="12" fill="#1f5c47">Done by hand today (three lines the proposal folds into one call):</text>
  <text data-layer-name="code" x="40" y="344" font-family="monospace" font-size="12" fill="#1f5c47">  let bb = dot.boundingBox();</text>
  <text data-layer-name="code" x="40" y="362" font-family="monospace" font-size="12" fill="#1f5c47">  dotMarker.viewBox = &quot;-5 -5 10 10&quot;;   // `${bb.x} ${bb.y} ${bb.width} ${bb.height}`</text>
  <text data-layer-name="code" x="40" y="380" font-family="monospace" font-size="12" fill="#1f5c47">  dotMarker.refX = 0; dotMarker.refY = 0;   // bb centre — or a BBoxAnchor</text>
  <text data-layer-name="code" x="40" y="412" font-family="monospace" font-size="12" fill="#1f5c47">Proposed: Marker.fromPathBlock('dot', dot) — or marker.fit(dot) on an existing Marker.</text>
  <text data-layer-name="code" x="40" y="430" font-family="monospace" font-size="12" fill="#1f5c47">Not proposed: fitting on every append, which would move every marker that relies on 0 0 w h.</text>
</svg>