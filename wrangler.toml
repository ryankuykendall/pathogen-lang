# Cloudflare Pages configuration — Pathogen Studio site.
#
# After the API split (commit ?), this Pages project only renders SSR HTML
# (homepage, /explore, /featured, /u/:handle) and serves SPA + static
# assets. Every /api/* endpoint moved to the pathogen-api Worker at
# api.pathogen.studio. See api/wrangler.toml for the API project's config.

name = "svg-path-extended"
compatibility_date = "2026-04-30"
pages_build_output_dir = "public"

# KV — public workspace index reads (explore, featured, profile pages).
# Pages does not write to KV; the API Worker owns mutations.
[[kv_namespaces]]
binding = "WORKSPACES"
id = "fdaa643f894a4a118329961dcd0e8d0e"
preview_id = "19a9d6b448604bca927cc6a198f4a96a"

# D1 — getSsrUser() reads the session cookie and looks up the user for
# first-paint account-menu hydration. Pages does not write to USERS_DB.
[[d1_databases]]
binding = "USERS_DB"
database_name = "svg-path-extended-users"
database_id = "2e2a60c3-a0c7-442d-b695-27e2b3bc7679"

# THUMBNAILS R2 binding REMOVED — only the pathogen-api Worker reads/writes
# thumbnails. SSR pages reference thumbnails via cross-origin <img src> at
# https://api.pathogen.studio/thumbnail/...
#
# Email-related bindings/vars (EMAIL, AUTH_FROM_EMAIL, AUTH_PRODUCT_NAME,
# AUTH_RESEND_API_KEY) REMOVED — the API Worker handles all email sending.
#
# COOKIE_DOMAIN / PRODUCTION are NOT needed here — Pages only reads the
# session cookie via getSsrUser(); it never writes or clears it. Both vars
# live in api/wrangler.toml where the cookie is issued.
