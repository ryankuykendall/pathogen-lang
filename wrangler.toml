# Cloudflare Pages configuration — Pathogen Studio site.
#
# After the API split (commit ?), this Pages project only renders SSR HTML
# (homepage, /explore, /featured, /u/:handle) and serves SPA + static
# assets. Every /api/* endpoint moved to the pathogen-api Worker at
# api.pathogen.studio. See api/wrangler.toml for the API project's config.

name = "svg-path-extended"
compatibility_date = "2026-04-30"
pages_build_output_dir = "public"

# KV — public workspace index reads (explore, featured, profile pages).
# Pages does not write to KV; the API Worker owns mutations.
[[kv_namespaces]]
binding = "WORKSPACES"
id = "fdaa643f894a4a118329961dcd0e8d0e"
preview_id = "19a9d6b448604bca927cc6a198f4a96a"

# D1 — getSsrUser() reads the session cookie and looks up the user for
# first-paint account-menu hydration. Pages does not write to USERS_DB.
[[d1_databases]]
binding = "USERS_DB"
database_name = "svg-path-extended-users"
database_id = "2e2a60c3-a0c7-442d-b695-27e2b3bc7679"

# THUMBNAILS R2 binding REMOVED — only the pathogen-api Worker reads/writes
# thumbnails. SSR pages reference thumbnails via cross-origin <img src>; the
# origin is read from env.API_BASE below so localhost dev can point at
# http://localhost:8787 instead of the production API.
#
# Email-related bindings/vars (EMAIL, AUTH_FROM_EMAIL, AUTH_PRODUCT_NAME,
# AUTH_RESEND_API_KEY) REMOVED — the API Worker handles all email sending.
#
# COOKIE_DOMAIN / PRODUCTION are NOT needed here — Pages only reads the
# session cookie via getSsrUser(); it never writes or clears it. Both vars
# live in api/wrangler.toml where the cookie is issued.

[vars]
# npm used by the Cloudflare Pages BUILD. Pages exports [vars] into the build
# environment (the build log prints them under "Build environment variables"),
# and the v3 build image otherwise keeps its baked-in npm 10.9.2 even after
# installing the Node 24 that .node-version asks for. Lockfiles written by npm
# 11 (what Node 24 bundles, and what every developer machine runs) omit
# optional-peer entries that npm 10's clean-install then reports as "Missing …
# from lock file" — see project-docs/dependency-upgrades/STATUS.md. Keeping the
# build on the same major as development removes that drift. This also lands
# as a (harmless, unused) runtime binding on the Pages Function.
NPM_VERSION = "11"

# Origin of the pathogen-api Worker. Used by SSR-rendered cards
# (/explore, /featured, /u/:handle, /u/:handle/:slug) to build
# cross-origin <img src> URLs for workspace thumbnails. Override in
# .dev.vars with API_BASE=http://localhost:8787 for local dev.
API_BASE = "https://api.pathogen.studio"
